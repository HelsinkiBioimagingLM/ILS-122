# .github/workflows/update-conda-locks.yml
on:
  push:
    paths:
      - 'pixi.lock'
      - '.github/workflows/update-conda-locks.yml'

# The default environment is written to conda-locks/conda-lock.yml, other
# environments to conda-locks/<env>.conda-lock.yml

permissions:
  contents: write

jobs:
  update-conda-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pixi-to-conda-lock
      - run: |
          mkdir -p conda-locks
          pixi-to-conda-lock --output conda-locks pixi.lock
      # map pixi.lock v7 platform aliases (if any) back to linux-64/win-64, and sort
      # entries so regenerating without pin changes gives no diff
      - run: python scripts/normalize-conda-locks.py pixi.lock conda-locks/*conda-lock.yml
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update conda-lock files"
          file_pattern: "conda-locks/*conda-lock.yml"
