[workspace]
authors = ["Harri Jäälinoja <harri.jaalinoja@helsinki.fi>"]
channels = ["conda-forge"]
name = "ILS-122"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]

[dependencies]
napari = ">=0.9.2,<0.10"
pyqt = "*"
dask = "*"
tifffile = "*"
numpy = "*"
jupyterlab = "*"
pandas = "*"
# matplotlib-base and seaborn-base: the full metapackages pull in another Qt binding
matplotlib-base = "*"
seaborn-base = "*"
# git filter that strips notebook outputs from commits (see README)
nbstripout = "*"
